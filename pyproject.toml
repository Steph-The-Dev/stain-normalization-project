[project]
name = "stain-normalization-project"
version = "0.1.0"
description = "Histological Stain Normalization Suite for Digital Pathology"
authors = [
    { name = "Steph-The-Dev" }
]
dependencies = [
    "streamlit>=1.30.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
